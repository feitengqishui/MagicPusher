
name: Build MagicPusher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q MagicPusher_AndroidProject_0.3.0.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Cannot find settings.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicPusher-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
